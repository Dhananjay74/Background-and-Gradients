<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment 2</title>
    <!-- css -->
    <link rel="stylesheet" href="style.css" />
    <!-- font awesome -->
    <script
      src="https://kit.fontawesome.com/0ea607f749.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <header class="header">
      <div class="container flex">
        <div>
          <h1>Social Media Dashboard</h1>
          <p>Total Followers: 23,004</p>
        </div>
        <div class="darkmode-btn flex">
          <span class="dark-txt">Dark Mode</span>
          <div class="toggle">
            <span class="toggle-circle"> </span>
          </div>
        </div>
      </div>
    </header>
    <!-- main section -->
    <main>
      <section class="socialmedia-section">
        <div class="container flex">
          <div class="box box1">
            <a class="top" href="#"
              ><i class="fa-brands fa-square-facebook"></i>
              <span>@nathnanf</span></a
            >
            <h2>1946</h2>
            <p class="center">Followers</p>
            <div class="up">
              <i class="fa-solid fa-caret-up"></i>
              <span>12 Today</span>
            </div>
          </div>
          <div class="box box2">
            <a class="top" href="#"
              ><i class="fa-brands fa-twitter"></i> <span>@nathnanf</span></a
            >
            <h2>1044</h2>
            <p class="center">Followers</p>
            <div class="up">
              <i class="fa-solid fa-caret-up"></i>
              <span>99 Today</span>
            </div>
          </div>
          <div class="box box3">
            <a class="top insta" href="#"
              ><i class="fa-brands fa-instagram"></i>
              <span>@realnathanf</span></a
            >
            <h2>11K</h2>
            <p class="center">Followers</p>
            <div class="up">
              <i class="fa-solid fa-caret-up"></i>
              <span>1099 Today</span>
            </div>
          </div>
          <div class="box box4">
            <a class="top youtube" href="#"
              ><i class="fa-brands fa-square-youtube"></i>
              <span>@Nathan F.</span></a
            >
            <h2>8239</h2>
            <p class="center">Subscribers</p>
            <div class="down1">
              <i class="fa-solid fa-sort-down"></i>
              <span>144 Today</span>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
